services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 4000
      DB_URL: mongodb://mongo:27017/file-manager
      API_URL: http://localhost:4000/api
      CLIENT_URL: http://localhost:3000
      UPLOAD_URL: /app/files
      SESSION_PATH: /app/sessions
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - uploads:/app/files
      - sessions:/app/sessions
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
      args:
        REACT_APP_API_URL: http://localhost:4000/api
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  mongo-data:
  uploads:
  sessions:
